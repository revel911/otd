name: Deploy site to GitHub Pages

# Publishes the static site at the repository root to ourtimedesigns.com (Pages custom domain, set in
# Settings -> Pages). No build step: the checkout is uploaded as-is, minus docs/ and .github/.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir -p _site
          cp -r index.html styles.css site.js hero-motion.js assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
